name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PokeBattle.slnx

      - name: Format check
        run: dotnet format PokeBattle.slnx --verify-no-changes

      - name: Build
        run: dotnet build PokeBattle.slnx --no-restore -c Release

      # Integration tests start Postgres with Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test PokeBattle.slnx --no-build -c Release

      - name: No pending EF Core model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            --project src/PokeBattle.Infrastructure --startup-project src/PokeBattle.Infrastructure

      - name: Core coverage gate (90% line)
        run: |
          rm -rf coverage-core
          dotnet test tests/PokeBattle.Core.Tests --no-build -c Release \
            --collect:"XPlat Code Coverage" --results-directory coverage-core
          report=$(find coverage-core -name coverage.cobertura.xml | head -n1)
          rate=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$report').getroot().get('line-rate'))")
          echo "PokeBattle.Core line coverage: $rate"
          python3 -c "import sys; sys.exit(0 if float('$rate') >= 0.90 else 1)" \
            || { echo "::error::Core line coverage $rate is below the 90% gate"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: pokebattle-api:ci
          load: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pokebattle-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build migrations image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: migrate
          push: false
          tags: pokebattle-migrate:ci
          load: true

      - name: Scan migrations image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pokebattle-migrate:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: pokebattle-web:ci
          load: true

      - name: Scan web image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pokebattle-web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        with:
          working-directory: backend

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3

  publish-image:
    if: github.event_name == 'push'
    needs: [backend, frontend, docker, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokebattle-api:${{ github.sha }}

      - name: Build and push migrations
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokebattle-migrate:${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokebattle-web:${{ github.sha }}
