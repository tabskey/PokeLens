# Secrets come from .env (see .env.example), never from this file.

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: pokebattle
      POSTGRES_USER: pokebattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Loopback only, for running the API outside Docker; never reachable from other hosts.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokebattle -d pokebattle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Explicit migration step: applies the EF Core bundle and exits; the API never migrates on start-up.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    command: ["--connection", "Host=db;Database=pokebattle;Username=pokebattle;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Database=pokebattle;Username=pokebattle;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      - Auth__AdminEmails=${ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
